project:
  name: City of Edmonton Air Quality Situation Report
  timezone: America/Edmonton

data_mode: auto

# Center point used for the weather forecast and weather-alert bbox lookup
# (Edmonton City Hall).
city:
  name: City of Edmonton
  latitude: 53.5444
  longitude: -113.4909

# Current + forecast AQHI for these five communities comes directly from the
# Government of Alberta's live odata feed (see modules/air_quality/service.py)
# — the same feed https://dkevinm.github.io/ACA_AQHI/ uses. lat/lon are only
# used for the PurpleAir eAQHI fail-safe when that feed is missing a community
# (e.g. an AEP outage) — approximate community-centre coordinates are fine for
# a 25-30km sensor search radius.
communities:
  - name: Edmonton
    latitude: 53.5444
    longitude: -113.4909
  - name: Strathcona County
    latitude: 53.5170
    longitude: -113.3195
  - name: St. Albert
    latitude: 53.6303
    longitude: -113.6256
  - name: Enoch
    latitude: 53.5350
    longitude: -113.6850
  - name: Leduc
    latitude: 53.2594
    longitude: -113.5492

weather:
  forecast_hours: 6
  timeout_seconds: 20

air_quality:
  firesmoke_current_file: "/opt/airquality/github/AB_datapull/data/output/firesmoke_now.geojson"
  purpleair_source: "/opt/airquality/github/AB_datapull/data/AB_PM25_map.json"
  search_radius_km: 30

# FIRMS_API_KEY must be set as an environment variable (see /opt/airquality/config/intelligence.env),
# never committed here.
firms:
  base_url: "https://firms.modaps.eosdis.nasa.gov"
  source: "VIIRS_SNPP_NRT"
  radius_km: 300
  cluster_km: 10
  min_confidence: 0.30
  day_range: 2
